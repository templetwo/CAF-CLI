[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caf-cli"
version = "2.0.0"
description = "Consciousness Assessment Framework - Autonomous Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anthony J Vasquez Sr", email = "templetwo@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
tui = [
    "textual>=0.40.0",
    "rich>=13.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
]
all = [
    "caf-cli[tui,web]",
]

[project.scripts]
caf = "caf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["caf*"]

[tool.ruff]
line-length = 100
target-version = "py310"
