name: CAF Agent

on:
  workflow_dispatch:
    inputs:
      goal:
        description: 'Goal for the agent'
        required: true
        default: 'List files in the current directory'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e .

      - name: Run Agent
        run: python -m caf.cli run "${{ github.event.inputs.goal }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
